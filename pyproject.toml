[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-reconciliation-assistant"
version = "0.1.0"
description = "Auditable transaction reconciliation with pgvector-grounded regulatory retrieval"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
